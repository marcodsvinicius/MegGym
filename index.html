<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MegGym</title>
  <meta name="description" content="Monte seus treinos, acompanhe os exercícios e registre sua atividade.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MegGym">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <script src="assets/js/theme.js?v=23"></script>
  <link rel="preload" href="assets/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v=23">
</head>
<body class="app-body">
  <!-- Onboarding / entrada -->
  <section class="login-screen hidden" id="login-screen" aria-live="polite">
    <div class="onboarding" id="onboarding"></div>
  </section>

  <!-- App -->
  <div class="app-shell hidden" id="app-shell">
    <header class="app-header">
      <button class="icon-btn hidden" type="button" id="back-btn" aria-label="Voltar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="app-title" id="app-title">MegGym</h1>
      <div class="app-header-action" id="header-action"></div>
    </header>

    <main class="app-main" id="app" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Menu principal">
      <a href="#/inicio" data-tab="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Início</span>
      </a>
      <a href="#/treinos" data-tab="treinos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        <span>Treinos</span>
      </a>
      <a href="#/exercicios" data-tab="exercicios">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
        <span>Exercícios</span>
      </a>
      <a href="#/atividade" data-tab="atividade">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Atividade</span>
      </a>
    </nav>
  </div>

  <!-- Detalhes do exercício -->
  <div class="sheet-backdrop hidden" id="sheet">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-bar" id="sheet-handle">
        <span class="sheet-grip" aria-hidden="true"></span>
        <button class="icon-btn" type="button" id="sheet-close" aria-label="Fechar">✕</button>
      </div>
      <div class="sheet-content" id="sheet-content"></div>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>

  <script src="assets/js/config.js?v=23"></script>
  <script src="assets/js/supabase.js?v=23"></script>
  <script src="assets/js/common.js?v=23"></script>
  <script src="assets/js/store.js?v=23"></script>
  <script src="assets/js/pwa.js?v=23"></script>
  <script src="assets/js/app.js?v=23"></script>
</body>
</html>
